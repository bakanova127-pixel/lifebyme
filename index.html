<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Life by me Club</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Cormorant+Infant:ital,wght@0,500;0,600;1,500&family=Marck+Script&family=Nunito:wght@400;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Bad+Script&family=Lora:ital,wght@0,500;0,600;1,500&family=Caveat:wght@500;600&family=Comfortaa:wght@500;700&family=Pacifico&family=Kurale&family=Philosopher:ital,wght@0,400;0,700;1,400&family=Montserrat+Alternates:wght@500;600&family=Manrope:wght@400;600;700&family=Neucha&family=Rubik+Mono+One&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap">
<style>
/* Layout: phone-first Telegram Mini App — onboarding wizard, then four tabs with a bottom bar; skins swap the accent family */
:root{
  --bg:#fbf1ef; --paper:#fffaf8; --ink:#4a2f3a; --muted:#97808a; --line:#f0dade;
  --rose:#d27389; --rose-soft:#f7dde3; --sage:#7c9c77; --sage-soft:#e3eddf; --butter:#f2cf6e; --sky:#8fb3cf; --sky-soft:#e2edf5; --on-accent:#ffffff;
  --display:"Cormorant Infant", Georgia, serif; --script:"Marck Script", "Segoe Script", cursive; --body:"Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  --shadow:0 6px 24px -14px rgba(160,80,100,.45);
  --safe-top:max(env(safe-area-inset-top,0px), var(--tg-content-safe-area-inset-top,0px));
  --safe-bottom:max(env(safe-area-inset-bottom,0px), var(--tg-content-safe-area-inset-bottom,0px));
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#261b21;--paper:#31242b;--ink:#f5e6ea;--muted:#bba2ab;--line:#46343d;--rose:#e894a8;--rose-soft:#4c2f3a;--sage:#9fc09a;--sage-soft:#2f3d30;--butter:#f2d27e;--sky:#a9c6dd;--sky-soft:#2b3944;--on-accent:#2a1820;--shadow:0 6px 24px -14px rgba(0,0,0,.7);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#261b21;--paper:#31242b;--ink:#f5e6ea;--muted:#bba2ab;--line:#46343d;--rose:#e894a8;--rose-soft:#4c2f3a;--sage:#9fc09a;--sage-soft:#2f3d30;--butter:#f2d27e;--sky:#a9c6dd;--sky-soft:#2b3944;--on-accent:#2a1820;--shadow:0 6px 24px -14px rgba(0,0,0,.7);color-scheme:dark}
body[data-skin="lavender"]{--bg:#f6f2fb;--paper:#fdfbff;--ink:#3d3350;--muted:#8a7f9c;--line:#e6ddf2;--rose:#9b7ec8;--rose-soft:#ece3f7;--sage:#6f9e8f;--sage-soft:#e0efe9;--sky:#8fb0d6;--sky-soft:#e3ecf7;--on-accent:#fff}
body[data-skin="peach"]{--bg:#fdf3ec;--paper:#fffaf6;--ink:#4b3128;--muted:#9b8076;--line:#f3ddd0;--rose:#d9785a;--rose-soft:#fbe2d6;--sage:#5f9a90;--sage-soft:#dff0ec;--sky:#86b4c9;--sky-soft:#e1eff5;--on-accent:#fff}
body[data-skin="minimal"]{--bg:#f5f4f2;--paper:#ffffff;--ink:#2b2a2e;--muted:#7f7d84;--line:#e5e3e0;--rose:#a8737e;--rose-soft:#efe5e6;--sage:#768a70;--sage-soft:#e9ece6;--sky:#8ca3b5;--sky-soft:#e5ebf0;--on-accent:#fff}
@media (prefers-color-scheme: dark){
 :root:not([data-theme="light"]) body[data-skin="lavender"]{--bg:#201b2a;--paper:#2b2438;--ink:#efe8f8;--muted:#ad9fc3;--line:#3d3450;--rose:#b9a0e3;--rose-soft:#3c3150;--sage:#98c3b3;--sage-soft:#2b3b36;--sky:#a9c3e3;--sky-soft:#2a3446;--on-accent:#1e1730}
 :root:not([data-theme="light"]) body[data-skin="peach"]{--bg:#271c18;--paper:#33251f;--ink:#f8e9e1;--muted:#c2a396;--line:#4a3830;--rose:#f0a283;--rose-soft:#4d3128;--sage:#8fc4ba;--sage-soft:#273a37;--sky:#a3c7d8;--sky-soft:#283840;--on-accent:#2a1712}
 :root:not([data-theme="light"]) body[data-skin="minimal"]{--bg:#1c1c1e;--paper:#262628;--ink:#f1f0ee;--muted:#a19fa5;--line:#3a393c;--rose:#d3a3ac;--rose-soft:#3c3033;--sage:#a3b49d;--sage-soft:#2c312a;--sky:#a8bccb;--sky-soft:#2a3036;--on-accent:#1c1c1e}}
:root[data-theme="dark"] body[data-skin="lavender"]{--bg:#201b2a;--paper:#2b2438;--ink:#efe8f8;--muted:#ad9fc3;--line:#3d3450;--rose:#b9a0e3;--rose-soft:#3c3150;--sage:#98c3b3;--sage-soft:#2b3b36;--sky:#a9c3e3;--sky-soft:#2a3446;--on-accent:#1e1730}
:root[data-theme="dark"] body[data-skin="peach"]{--bg:#271c18;--paper:#33251f;--ink:#f8e9e1;--muted:#c2a396;--line:#4a3830;--rose:#f0a283;--rose-soft:#4d3128;--sage:#8fc4ba;--sage-soft:#273a37;--sky:#a3c7d8;--sky-soft:#283840;--on-accent:#2a1712}
:root[data-theme="dark"] body[data-skin="minimal"]{--bg:#1c1c1e;--paper:#262628;--ink:#f1f0ee;--muted:#a19fa5;--line:#3a393c;--rose:#d3a3ac;--rose-soft:#3c3033;--sage:#a3b49d;--sage-soft:#2c312a;--sky:#a8bccb;--sky-soft:#2a3036;--on-accent:#1c1c1e}

/* design presets: fonts per skin */
body[data-skin="powder"]{--display:"Playfair Display",Georgia,serif;--script:"Bad Script",cursive}
body[data-skin="lavender"]{--display:"Lora",Georgia,serif;--script:"Caveat",cursive}
body[data-skin="strawberry"]{--display:"Comfortaa",system-ui,sans-serif;--script:"Pacifico",cursive}
body[data-skin="peach"]{--display:"Kurale",Georgia,serif;--script:"Marck Script",cursive}
body[data-skin="mint"]{--display:"Philosopher",Georgia,serif;--script:"Caveat",cursive}
body[data-skin="minimal"]{--display:"Montserrat Alternates",system-ui,sans-serif;--script:"Caveat",cursive;--body:"Manrope",system-ui,sans-serif}
body[data-skin="powder"]{--bg:#fbf3f3;--paper:#fffafa;--ink:#4a3236;--muted:#9a8487;--line:#f1e1e2;--rose:#c27f8a;--rose-soft:#f6e4e6;--sage:#97a688;--sage-soft:#ecf0e6;--butter:#ead2a8;--sky:#a9bfd0;--sky-soft:#e7eef3;--on-accent:#fff}
body[data-skin="strawberry"]{--bg:#fff3f5;--paper:#fffafb;--ink:#5a2a36;--muted:#a07c86;--line:#fadbe2;--rose:#e2507a;--rose-soft:#ffe0e8;--sage:#6fa98c;--sage-soft:#e2f2ea;--butter:#ffd27a;--sky:#9cc3e0;--sky-soft:#e5f0f8;--on-accent:#fff}
body[data-skin="mint"]{--bg:#f2f8f5;--paper:#fbfefc;--ink:#2f4740;--muted:#7a918a;--line:#d9ebe3;--rose:#d97a92;--rose-soft:#fbe3ea;--sage:#4fa085;--sage-soft:#dcf1e8;--butter:#f4d47c;--sky:#8cc0d6;--sky-soft:#e1f0f6;--on-accent:#fff}
@media (prefers-color-scheme: dark){
 :root:not([data-theme="light"]) body[data-skin="powder"]{--bg:#251c1e;--paper:#302527;--ink:#f6e9ea;--muted:#c0a6aa;--line:#45363a;--rose:#e3a8b0;--rose-soft:#4a3337;--sage:#b8c6aa;--sage-soft:#2f3529;--butter:#ecd5ad;--sky:#b5cadb;--sky-soft:#2a343c;--on-accent:#2a1a1d}
 :root:not([data-theme="light"]) body[data-skin="strawberry"]{--bg:#2a1820;--paper:#36212a;--ink:#ffe9ef;--muted:#c9a0ad;--line:#4d2f3a;--rose:#ff86a2;--rose-soft:#55303d;--sage:#9ccbb3;--sage-soft:#26392f;--butter:#ffd98f;--sky:#addaf2;--sky-soft:#253744;--on-accent:#2a0f18}
 :root:not([data-theme="light"]) body[data-skin="mint"]{--bg:#18231f;--paper:#212e29;--ink:#e6f4ee;--muted:#9fb8ae;--line:#33463f;--rose:#f0a5b6;--rose-soft:#4a2f37;--sage:#86cdb2;--sage-soft:#233b32;--butter:#f2d88c;--sky:#a6d2e4;--sky-soft:#223640;--on-accent:#10201a}}
:root[data-theme="dark"] body[data-skin="powder"]{--bg:#251c1e;--paper:#302527;--ink:#f6e9ea;--muted:#c0a6aa;--line:#45363a;--rose:#e3a8b0;--rose-soft:#4a3337;--sage:#b8c6aa;--sage-soft:#2f3529;--butter:#ecd5ad;--sky:#b5cadb;--sky-soft:#2a343c;--on-accent:#2a1a1d}
:root[data-theme="dark"] body[data-skin="strawberry"]{--bg:#2a1820;--paper:#36212a;--ink:#ffe9ef;--muted:#c9a0ad;--line:#4d2f3a;--rose:#ff86a2;--rose-soft:#55303d;--sage:#9ccbb3;--sage-soft:#26392f;--butter:#ffd98f;--sky:#addaf2;--sky-soft:#253744;--on-accent:#2a0f18}
:root[data-theme="dark"] body[data-skin="mint"]{--bg:#18231f;--paper:#212e29;--ink:#e6f4ee;--muted:#9fb8ae;--line:#33463f;--rose:#f0a5b6;--rose-soft:#4a2f37;--sage:#86cdb2;--sage-soft:#233b32;--butter:#f2d88c;--sky:#a6d2e4;--sky-soft:#223640;--on-accent:#10201a}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;overflow-x:hidden;
  background-image:radial-gradient(circle at 12% 0%, var(--rose-soft) 0, transparent 40%),radial-gradient(circle at 100% 35%, var(--sage-soft) 0, transparent 32%);background-attachment:fixed}
.app{max-width:560px;margin:0 auto;padding:calc(14px + var(--safe-top)) max(16px, env(safe-area-inset-right,0px)) calc(96px + var(--safe-bottom)) max(16px, env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px;position:relative}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance}
h2{font-size:1.5rem;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
h2 small{font-family:var(--body);font-size:.88rem;font-weight:400;color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--rose);outline-offset:3px}
.muted{color:var(--muted)}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand .logo{font-family:var(--script);font-size:1.8rem;color:var(--rose);line-height:1}
.brand .club{font-size:.7rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);font-weight:700}
.card{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;min-width:0}
.btn{border:0;background:var(--rose);color:var(--on-accent);border-radius:16px;padding:13px 18px;font-weight:700;font-size:1rem}
.btn.full{width:100%}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:600}
.btn:disabled{opacity:.5}
input,textarea{border:1px solid var(--line);border-radius:14px;background:var(--paper);color:var(--ink);font:inherit;padding:11px 13px;width:100%;min-width:0}
.field{display:flex;flex-direction:column;gap:6px;font-size:.85rem;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:8px 14px;font-size:.92rem}
.chip[aria-pressed="true"]{background:var(--rose);border-color:var(--rose);color:var(--on-accent)}
.chip.small{padding:5px 11px;font-size:.85rem}
.tag{display:inline-block;background:var(--sage-soft);color:var(--sage);border-radius:999px;padding:2px 12px;font-size:.8rem;font-weight:700}
.empty{color:var(--muted);font-style:italic;margin:0}
.note{background:var(--sage-soft);border-radius:16px;padding:10px 14px;font-size:.9rem}

/* onboarding */
.ob{min-height:calc(100vh - 60px);display:flex;flex-direction:column;gap:18px}
.ob .step{font-size:.75rem;letter-spacing:.16em;text-transform:uppercase;color:var(--rose);font-weight:700}
.ob h1{font-size:2.3rem;line-height:1.05}
.ob p{margin:0}
.ob .grow{flex:1}
.dots{display:flex;gap:6px}
.dots i{height:6px;flex:1;border-radius:6px;background:var(--line)}
.dots i.on{background:var(--rose)}
.hero-flower{width:180px;height:180px;align-self:center}
.consent{font-size:.82rem;color:var(--muted)}

/* today */
.hero{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.hero .date{font-family:var(--script);font-size:1.35rem;color:var(--rose)}
.hero h1{font-size:2.1rem;line-height:1.05}
.hero .sub{color:var(--muted);font-size:.92rem;margin-top:4px}
.bloom{width:108px;height:108px;position:relative}
.bloom svg{width:100%;height:100%}
.bloom b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:1.1rem;color:#5b3a1e}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.pill{display:inline-flex;gap:6px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:3px 11px;font-size:.8rem}
.pill i{width:8px;height:8px;border-radius:50%}
.quote{font-family:var(--display);font-style:italic;font-size:1.3rem;line-height:1.35;margin:0}
ul.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.item{display:flex;align-items:center;gap:10px;padding:8px 6px;border-radius:14px;min-width:0}
.item .txt{flex:1;min-width:0;overflow-wrap:anywhere}
.item .meta{display:block;font-size:.82rem;color:var(--muted)}
.item .reps{font-variant-numeric:tabular-nums;color:var(--sage);font-weight:700;white-space:nowrap;font-size:.92rem}
.item .streak{font-size:.78rem;color:var(--muted)}
.item.done .txt{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--rose)}
.item .x{border:0;background:none;color:var(--muted);padding:2px 6px;font-size:1.2rem;opacity:.6}
.check{flex:none;width:32px;height:32px;border:0;background:none;padding:0;display:grid;place-items:center}
.check .ring{width:24px;height:24px;border-radius:50%;border:2px solid var(--rose);opacity:.7}
.check svg{width:32px;height:32px;display:none}
.done>.check .ring{display:none}.done>.check svg{display:block;animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.2) rotate(-60deg)}100%{transform:scale(1) rotate(0)}}
.add{display:flex;gap:8px}
.add input{border-style:dashed;border-color:var(--rose);background:transparent}
.add .btn{padding:0 16px}
.water{display:flex;gap:6px;flex-wrap:wrap}
.glass{width:36px;height:44px;border:0;background:none;padding:0}
.glass svg{width:100%;height:100%}
.glass .f{fill:var(--sky-soft)}.glass.on .f{fill:var(--sky)}.glass .r{fill:none;stroke:var(--sky);stroke-width:2}
.scale{display:flex;gap:6px;flex-wrap:wrap}
.chgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.chday{aspect-ratio:1;border-radius:10px;background:var(--rose-soft);display:grid;place-items:center;font-size:.75rem;color:var(--muted);max-width:100%}
.chday.yes{background:var(--rose);color:var(--on-accent);font-weight:700}.chday.no{background:transparent;border:1px dashed var(--line)}
.chday.today{outline:2px solid var(--butter);outline-offset:1px}

/* week & body */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dayc{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:14px}
.dayc.sel{background:var(--rose-soft)}
.dayc .wd{font-size:.7rem;color:var(--muted);text-transform:uppercase}
.dayc .dn{font-family:var(--display);font-size:1.15rem;font-weight:600}
.dayc svg{width:24px;height:24px}
.heat{overflow-x:auto}
.heat table{border-collapse:separate;border-spacing:3px;font-size:.82rem}
.heat th{text-align:left;font-weight:600;white-space:nowrap;padding-right:6px;max-width:130px;overflow:hidden;text-overflow:ellipsis}
.heat td{width:15px;height:15px;border-radius:5px;background:var(--rose-soft);padding:0}
.heat td.on{background:var(--rose)}
.wstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));text-align:center}
.wstats b{display:block;font-family:var(--display);font-size:1.7rem;line-height:1.1;font-variant-numeric:tabular-nums}
.wstats span{font-size:.78rem;color:var(--muted)}
.vine{height:12px;border-radius:999px;background:var(--sage-soft);overflow:hidden}
.vine i{display:block;height:100%;background:linear-gradient(90deg,var(--sage),var(--rose));border-radius:999px}
.spark{width:100%;height:64px}
.cyc{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.cyc svg{width:104px;height:104px}
.cyc .n{font-family:var(--display);font-size:1.35rem;font-weight:600;line-height:1.1}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.skins{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.skin{border:2px solid var(--line);border-radius:18px;padding:12px;background:var(--paper);display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.skin[aria-pressed="true"]{border-color:var(--rose)}
.skin .sw{display:flex;gap:4px}.skin .sw i{width:18px;height:18px;border-radius:50%}

/* birthday & dream board */
.bday{background:linear-gradient(135deg,var(--rose-soft),var(--paper) 60%,var(--sage-soft));text-align:center;align-items:center;position:relative;overflow:hidden}
.bday h2{justify-content:center;font-size:1.8rem}
.bday .big{font-family:var(--script);font-size:2.2rem;color:var(--rose);line-height:1.1}
.bday svg.confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.55}
.aff{background:linear-gradient(135deg,var(--rose-soft),var(--paper));gap:4px}
.aff .eyebrow,.eyebrow{font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--rose);font-weight:700}
.aff p{margin:0;font-family:var(--display);font-style:italic;font-size:1.3rem;line-height:1.3}
textarea{min-height:110px;resize:vertical;line-height:1.5}
.ideal{font-family:var(--display);font-size:1.1rem;line-height:1.55;white-space:pre-wrap;margin:0}
.skin .sample{font-family:var(--display);font-size:1.15rem;line-height:1.1}
.skin .sample2{font-family:var(--script);font-size:1.1rem;color:var(--rose);line-height:1}
.skin small{color:var(--muted);font-size:.72rem}

/* money */
.big-num{font-family:var(--display);font-size:2.2rem;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.mrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center}
.mrow b{display:block;font-family:var(--display);font-size:1.25rem;font-variant-numeric:tabular-nums;line-height:1.2}
.mrow span{font-size:.75rem;color:var(--muted)}
.bar{height:10px;border-radius:999px;background:var(--rose-soft);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:var(--sage)}
.bar.warn i{background:var(--butter)}.bar.over i{background:#d0563f}
.cat{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center}
.cat .em{font-size:1.2rem}
.cat .nm{font-weight:600}
.cat .sm{font-variant-numeric:tabular-nums;font-weight:700;font-size:.92rem;text-align:right}
.cat .bar,.cat .hint{grid-column:2/4}
.cat .hint{font-size:.75rem;color:var(--muted);margin-top:-2px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--rose-soft);border-radius:14px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:11px;padding:8px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--paper);box-shadow:var(--shadow);color:var(--rose)}
.amount{font-family:var(--display);font-size:1.6rem;font-weight:600;text-align:center}
.op{display:flex;align-items:center;gap:10px;padding:6px 2px;border-bottom:1px solid var(--line)}
.op:last-child{border-bottom:0}
.op .em{font-size:1.15rem}
.op .txt{flex:1;min-width:0;overflow-wrap:anywhere;font-size:.92rem}
.op .txt small{display:block;color:var(--muted);font-size:.75rem}
.op .sum{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.op .sum.plus{color:var(--sage)}

/* care, books, report */

input[type="time"],input[type="date"],select{border:1px solid var(--line);border-radius:14px;background:var(--paper);color:var(--ink);font:inherit;padding:10px 12px;min-width:0;width:100%}

/* v6: tasks, workouts, care hub */
[hidden]{display:none!important}
.hrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.item .tm{font-variant-numeric:tabular-nums;color:var(--rose);font-weight:700;font-size:.88rem;min-width:44px}

.prow{display:grid;grid-template-columns:30px repeat(4,minmax(0,1fr));gap:4px;align-items:center}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--paper);border-top:1px solid var(--line);padding:6px max(10px, env(safe-area-inset-right,0px)) calc(6px + var(--safe-bottom)) max(10px, env(safe-area-inset-left,0px))}

.toast{position:fixed;left:50%;bottom:calc(80px + var(--safe-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:.88rem;z-index:30;max-width:calc(100% - 32px);text-align:center}

/* preview outside Telegram: phone frame on wide screens */
.tgbar{display:none}
body.preview .tgbar{display:flex;align-items:center;justify-content:space-between;gap:8px;max-width:560px;margin:0 auto;padding:10px max(16px, env(safe-area-inset-right,0px)) 0 max(16px, env(safe-area-inset-left,0px));font-size:.82rem;color:var(--muted)}

  body.preview{padding-block:24px}
  body.preview .frame{width:400px;height:820px;margin:0 auto;border-radius:44px;border:10px solid #1f1a1d;overflow:hidden;position:relative;transform:translateZ(0);background:var(--bg);box-shadow:0 30px 80px -30px rgba(80,30,50,.5)}
  body.preview .scroller{height:100%;overflow-y:auto}
  body.preview .tabbar,body.preview .toast{position:absolute}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}


/* week strip on Today */
.wstrip{display:grid;grid-template-columns:26px repeat(7,minmax(0,1fr)) 26px;gap:3px;align-items:stretch}
.wstrip .ar{border:0;background:none;font-size:1.5rem;line-height:1;color:var(--rose);padding:0}
.wstrip .dy{border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:6px 0 5px;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0;color:var(--ink)}
.wstrip .dy small{font-size:.66rem;color:var(--muted);text-transform:uppercase;line-height:1.2}
.wstrip .dy b{font-size:1.05rem;line-height:1.15;font-variant-numeric:tabular-nums}
.wstrip .dy i{width:5px;height:5px;border-radius:50%;background:transparent}
.wstrip .dy.has i{background:var(--rose)}
.wstrip .dy.today{border-color:var(--rose);border-width:2px}
.wstrip .dy[aria-pressed="true"]{background:var(--rose);border-color:var(--rose);color:var(--on-accent)}
.wstrip .dy[aria-pressed="true"] small{color:var(--on-accent)}.wstrip .dy[aria-pressed="true"].has i{background:var(--on-accent)}
.wback{align-self:center;margin-top:-8px}
.chblock{display:flex;flex-direction:column;gap:8px;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.chblock:last-of-type{border-bottom:0}
/* workout player */
.pl{position:fixed;inset:0;z-index:60;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;gap:12px;padding:calc(14px + var(--safe-top)) 20px calc(20px + var(--safe-bottom));overflow:auto;max-width:560px;margin:0 auto}
.pl .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pl .top .muted{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.pl .bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}.pl .bar i{display:block;height:100%;background:var(--rose)}
.pl .ph{font-size:.95rem;letter-spacing:.18em;text-transform:uppercase;font-weight:700;color:var(--rose);margin-top:6px}
.pl.rest .ph,.pl.prep .ph{color:var(--sage)}
.pl h2.n{font-family:var(--display);font-size:2.35rem;line-height:1.1;margin:0}
.pl video{width:100%;max-height:38vh;object-fit:cover;border-radius:18px;background:var(--line)}
.pl .ring{--p:0;width:min(66vw,260px);aspect-ratio:1;border-radius:50%;margin:6px auto;display:grid;place-items:center;background:conic-gradient(var(--rose) calc(var(--p)*1%),var(--rose-soft) 0)}
.pl.rest .ring,.pl.prep .ring{background:conic-gradient(var(--sage) calc(var(--p)*1%),var(--sage-soft) 0)}
.pl .ring>div{width:84%;aspect-ratio:1;border-radius:50%;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center}
.pl .t{font-size:4.2rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.pl .rp{font-size:1.1rem;color:var(--muted);padding:0 8px}
.pl .how{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px 16px;font-size:1.15rem;line-height:1.5}
.pl .ctl{display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:10px;margin-top:auto}
.pl .ctl .btn{padding:14px 6px}
.pl .next{color:var(--muted);font-size:1.05rem;text-align:center;min-height:1.3em}
.pl .fin{margin:auto 0;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.pl .fin .big{font-size:4rem;line-height:1}
.wkrun{display:flex;flex-direction:column;gap:8px;background:var(--rose-soft);border-radius:16px;padding:12px}
.wkrun .btn{width:100%}
.wkrun .opts{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.85rem;color:var(--ink)}

/* badges & club */
.badges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.bdg{border:1.5px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--paper);color:var(--ink);min-width:0}

.bdg.lock{opacity:.45}.bdg.crown.on{border-color:#C9A227;background:#FFF6D6}.more summary{cursor:pointer;color:var(--muted);font-size:.9rem;margin:6px 0}.more .badges{margin-top:8px}

.ccal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}

.clegend{display:flex;flex-wrap:wrap;gap:10px;font-size:.78rem;color:var(--muted)}.clegend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.cbig{text-align:center;padding:6px 0}.cbig b{display:block;font-family:var(--display);font-size:2.4rem;line-height:1.1}
/* ===== themes: 8 «Лоскуты», 9 «Бежевый люкс», 11 «Нашивки» — always light ===== */
body[data-skin="beige"],body[data-skin="badge"]{color-scheme:light}
.themes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.theme{border:2px solid var(--line);border-radius:18px;padding:8px;background:var(--paper);display:flex;flex-direction:column;gap:8px;text-align:left;min-width:0}

.theme .pv{height:74px;border-radius:12px;position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:8px}
.theme .pv span{border-radius:8px;padding:3px 8px;font-size:.78rem;font-weight:700}
.theme b{font-size:.92rem;line-height:1.2;padding:0 4px}
.theme small{color:var(--muted);font-size:.74rem;padding:0 4px 2px}

/* 8 · Лоскуты */

  --star:#B8243C;--hero:#34508A;--hero-ink:#FFFFFF;--hero-sub:#FFE8A3;--f1:#FFE8A3;--f1dot:#E9C055;--f2:rgba(184,36,60,.26);--nav:#FFF4D6}

  --star:#FF5C8A;--hero:#3A4660;--hero-ink:#FFFFFF;--hero-sub:#FFC2D4;--f1:#3A1E2A;--f1dot:#6A3550;--f2:rgba(143,166,214,.35);--nav:#1F1F22}

  background-image:radial-gradient(circle at 20% 30%,rgba(255,255,255,.16) 0 4px,transparent 5px),radial-gradient(circle at 70% 70%,rgba(255,255,255,.16) 0 4px,transparent 5px),repeating-linear-gradient(45deg,rgba(255,255,255,.06) 0 2px,transparent 2px 6px);background-size:46px 46px,46px 46px,auto}

const ls={get:k=>{try{return localStorage.getItem("lbm:"+k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem("lbm:"+k,v)}catch(e){}},del:k=>{try{localStorage.removeItem("lbm:"+k)}catch(e){}},
  keys:()=>{const out=[];try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith("lbm:"))out.push(k.slice(4))}}catch(e){}return out}};
const cloud={
  async getMany(keys){if(!keys.length)return{};if(useCloud)return new Promise(r=>tg.CloudStorage.getItems(keys,(err,v)=>r(err?{}:v||{})));const o={};for(const k of keys)o[k]=ls.get(k);return o},
  async keys(){if(useCloud)return new Promise(r=>tg.CloudStorage.getKeys((err,k)=>r(err?[]:k||[])));return ls.keys()},
  setRaw(key,s){if(useCloud)return new Promise(r=>tg.CloudStorage.setItem(key,s,()=>r()));ls.set(key,s);return Promise.resolve()},
  remove(keys){if(!keys.length)return Promise.resolve();if(useCloud)return new Promise(r=>tg.CloudStorage.removeItems(keys,()=>r()));keys.forEach(ls.del);return Promise.resolve()}

  if(!r||!r.ok){for(const [k,v] of Object.entries(put))if(!(k in SRV.put))SRV.put[k]=v;del.forEach(k=>{if(!(k in SRV.put))SRV.del.add(k)});SRV.fail++;if(SRV.fail===3)toast("Нет связи с сервером — сохраню, как только появится интернет");srvFlush(Math.min(60000,3000*SRV.fail))}

  async keys(){const loc=ls.keys().filter(LOCAL_ONLY);const main=SRV.on?Object.keys(SRV.m):(await cloud.keys()).filter(k=>!LOCAL_ONLY(k));return [...new Set(main.concat(loc))]},
  setRaw(key,s){if(LOCAL_ONLY(key)){ls.set(key,s);return Promise.resolve()}if(!SRV.on)return cloud.setRaw(key,s);SRV.m[key]=s;SRV.put[key]=s;SRV.del.delete(key);srvFlush();return Promise.resolve()},
  set(key,val){if(key==="settings"&&val&&("start" in val||"target" in val)){const {start,target,...rest}=val;ls.set("wgoal",JSON.stringify({start:start??null,target:target??null}));val=rest}return store.setRaw(key,JSON.stringify(val))},
  remove(keys){if(!keys.length)return Promise.resolve();const loc=keys.filter(LOCAL_ONLY),main=keys.filter(k=>!LOCAL_ONLY(k));loc.forEach(ls.del);
    if(!SRV.on)return cloud.remove(main);for(const k of main){delete SRV.m[k];delete SRV.put[k];SRV.del.add(k)}srvFlush();return Promise.resolve()}

function save(key,val,delay){if(key.startsWith("d_")&&typeof histUpd==="function"&&S.hist)histUpd(key.slice(2),val);clearTimeout(timers[key]);timers[key]=setTimeout(()=>store.set(key,val),delay??400)}
/* big values (longer than one Telegram cell) are split into parts: name__0..name__k + name__n */
const bigCount={};const legacy=new Set();
function setBig(name,val,delay){clearTimeout(timers["big_"+name]);timers["big_"+name]=setTimeout(async()=>{const str=JSON.stringify(val);const parts=[];for(let i=0;i<str.length;i+=3800)parts.push(str.slice(i,i+3800));if(!parts.length)parts.push("null");
  for(let i=0;i<parts.length;i++)await store.setRaw(`${name}__${i}`,parts[i]);await store.setRaw(`${name}__n`,String(parts.length));const old=bigCount[name]||0;if(old>parts.length)await store.remove(Array.from({length:old-parts.length},(_,i)=>`${name}__${parts.length+i}`));bigCount[name]=parts.length;
  if(legacy.has(name)){legacy.delete(name);store.remove([name])}},delay??300)}
async function getBig(keys,name){if(keys.includes(name+"__n")){const m=await store.getMany([name+"__n"]);const n=parseInt(m[name+"__n"])||0;bigCount[name]=n;const ks=Array.from({length:n},(_,i)=>`${name}__${i}`);let str="";
    for(let i=0;i<ks.length;i+=20){const part=await store.getMany(ks.slice(i,i+20));for(const k of ks.slice(i,i+20))str+=part[k]||""}try{return JSON.parse(str)}catch(e){return null}}
  if(keys.includes(name)){legacy.add(name);const m=await store.getMany([name]);try{return JSON.parse(m[name])}catch(e){return null}}return null}

const TZ=Intl.DateTimeFormat().resolvedOptions().timeZone||"Europe/Moscow";
function keyOf(d){return new Intl.DateTimeFormat("en-CA",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit"}).format(d)}
function parseKey(k){const [y,m,d]=k.split("-").map(Number);return new Date(Date.UTC(y,m-1,d,12))}
function shift(k,n){const d=parseKey(k);d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}
function diffDays(a,b){return Math.round((parseKey(a)-parseKey(b))/864e5)}
function mondayOf(k){return shift(k,-((parseKey(k).getUTCDay()+6)%7))}

  const plan=wkPlan(cfg()),dw=parseKey(k).getUTCDay(),order=[1,2,3,4,5,6,0].filter(x=>plan[x]===type);const i=Math.max(0,order.indexOf(dw));
